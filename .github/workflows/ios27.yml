name: iOS 27 compatibility (preview runner)
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios27-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  compatibility:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.0 explicitly
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 27.0'
      - name: Compile and test iOS 27
        run: bash scripts/build_ios.sh 27 test
      - name: Upload compatibility results (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CampusLens-iOS27-${{ github.run_number }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
